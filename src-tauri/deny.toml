# cargo-deny ayarları: bağımlılıkların lisanslarını ve kaynaklarını denetler.
# Kural: AGPL lisanslı ya da ticari kullanımı yasaklayan bağımlılık eklenmez.
# Yalnızca aşağıda izin verilen, GPL-3.0 ile uyumlu lisanslar kabul edilir.

[graph]
# Program önce Windows için yayımlanır; Linux/macOS hedefleri de denetlenir.
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]

[licenses]
confidence-threshold = 0.9
# Listede olup henüz kullanılmayan lisanslar uyarı vermesin.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "CDLA-Permissive-2.0",
  # Yazı tipleri (Inter, arayüzde; bkz. docs/LISANSLAR.md). Proje sahibi 8 Ekim 2026'da onayladı.
  "OFL-1.1",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# Güvenlik uyarıları ayrı bir iş olarak izlenir; lisans denetimi CI'yi bloklar.
ignore = []
