[package]
name = "lyraska"
version = "0.0.32"
description = "Görselleri şarkıyı önceden bilen, çevrimdışı müzik çalar"
authors = ["Lyraska geliştiricileri"]
license = "GPL-3.0-only"
repository = "https://github.com/gozlemesevdalisi/Lyraska"
edition = "2021"
rust-version = "1.85"

[lib]
# `_lib` soneki Windows'ta bin ve lib adlarının çakışmasını önler.
name = "lyraska_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.6", default-features = false, features = ["all", "opt-simd"] }
rtrb = "0.4"
thiserror = "2"
tauri-plugin-dialog = "2"
rustfft = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2"
serde_json = "1"
rubato = "5"
miniz_oxide = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[target."cfg(windows)".dependencies]
wasapi = "0.25"

[dev-dependencies]
allocation-counter = "0.8.1"
ts-rs = "12.0.1"

# Testler gerçek uzunlukta ses işler (ör. EBU 3341'in 80 saniyelik durumları); hafif
# iyileştirme testleri birkaç kat hızlandırır, derleme süresini az artırır.
[profile.test]
opt-level = 1
