# Her push ve PR'da: arayüz (TypeScript) ve çekirdek (Rust) testleri, lint ve
# lisans denetimi. PR'larda ayrıca Windows kurulum dosyası derlenir ve
# "Artifacts" bölümüne eklenir.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  arayuz:
    name: Arayüz (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biçim denetimi (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tür denetimi (TypeScript)
        run: npm run typecheck
      - name: Testler (Vitest)
        run: npm test
      - name: Lisans denetimi
        run: npm run check:licenses
      - name: Derleme
        run: npm run build

  cekirdek:
    name: Çekirdek (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Linux derleme bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Tauri, derleme sırasında arayüz dosyalarını (dist/) gömer.
      - name: Arayüzü derle
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Biçim denetimi (rustfmt)
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Lint (Clippy)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Testler
        working-directory: src-tauri
        run: cargo test --locked
      - name: Lisans ve kaynak denetimi (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses bans sources

  windows:
    name: Windows kurulum dosyası
    # main için kurulum dosyası "Test sürümü" iş akışında derlenir.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Kurulum dosyasını derle (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Kurulum dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Lyraska-Kurulum-PR
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
